<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Requests — SameNeed Provider</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar" id="navbar"></nav>
<div class="container">
    <div class="page-header">
        <h1>Group Requests</h1>
        <p>Browse group requests for services you offer. Click a request to submit an offer.</p>
    </div>
    <div id="results"><div class="loading">Loading eligible requests…</div></div>
</div>
<script src="/js/api.js"></script>
<script src="/js/requests.js"></script>
<script>
    const session = requireAuth(['SERVICE_PROVIDER']);
    if (session) {
        buildNavbar('navbar');
        loadRequests('results');
    }
</script>
</body>
</html>
