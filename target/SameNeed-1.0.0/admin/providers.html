<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Admin panel for managing service provider accounts on SameNeed.">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar" id="navbar"></nav>
<div class="container">
    <div class="page-header flex-between">

        <a href="/admin/index.html" class="btn btn-ghost btn-sm">← Dashboard</a>
    </div>

        <div class="table-wrapper">

        buildNavbar('navbar');
        loadUserTable('provider-table', 'SERVICE_PROVIDER');
    }
</script>
