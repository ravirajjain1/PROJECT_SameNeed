<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — SameNeed</title>
    <meta name="description" content="Sign in to SameNeed to group up with others who need the same service.">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-box { width: 100%; max-width: 400px; }
        .auth-logo { text-align: center; font-size: 1.5rem; font-weight: 700; color: var(--primary); margin-bottom: 1.5rem; }
        .auth-logo span { color: var(--gray-800); }
    </style>
</head>
<body>
<div class="auth-box">
    <div class="auth-logo">Same<span>Need</span></div>
    <div class="card">
        <h1 style="font-size:1.2rem;margin-bottom:1rem">Sign In</h1>
        <div id="msg" class="alert" style="display:none"></div>
        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" type="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" id="password" type="password" placeholder="••••••••" required>
            </div>
            <button class="btn btn-primary full-width" type="submit" id="submit-btn">Sign In</button>
        </form>
        <p class="text-sm text-muted mt-2" style="text-align:center">
            Don't have an account? <a href="/register.html">Register</a>
        </p>
    </div>
</div>
<script src="/js/api.js"></script>
<script>
    const existing = getSession();
    if (existing) {
        if (existing.role === 'ADMIN') window.location.href = '/admin/index.html';
        else if (existing.role === 'SERVICE_PROVIDER') window.location.href = '/provider-dashboard.html';
        else window.location.href = '/dashboard.html';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert('msg');
        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.textContent = 'Signing in…';

        const res = await fetchJson('POST', '/api/auth/login', {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        });

        if (res.ok) {
            setSession(res.data);
            if (res.data.role === 'ADMIN') window.location.href = '/admin/index.html';
            else if (res.data.role === 'SERVICE_PROVIDER') window.location.href = '/provider-dashboard.html';
            else window.location.href = '/dashboard.html';
        } else {
            showAlert('msg', res.data?.error || 'Login failed', 'error');
            btn.disabled = false;
            btn.textContent = 'Sign In';
        }
    });
</script>
</body>
</html>
